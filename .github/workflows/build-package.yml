name: All Build+Upload (Public Runner)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to checkout from private repo'
        required: true
        default: 'master'
      build_debug:
        description: 'Build Debug version (debug_remet Win32 & x64)'
        type: boolean
        default: true
      build_release:
        description: 'Build Release versions'
        type: boolean
        default: true
      build_installer:
        description: 'Build Installer'
        type: boolean
        default: true
      upload_releases:
        description: 'Upload to XAI-Medica/remet.releases'
        type: boolean
        default: true
      upload_gdrive:
        description: 'Upload Installer and Debug to Google Drive'
        type: boolean
        default: true
  repository_dispatch:
    types: [build-package]

jobs:
  build-and-package:
    runs-on: windows-2022
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.event.client_payload.branch || 'master' }}
      PRIVATE_REPO: "XAI-Medica/Remet"
      RELEASES_REPO: "XAI-Medica/remet.releases"
      OutPut: ${{ github.workspace }}\OutPut
      tmpProj: ${{ github.workspace }}\tmpProj
    steps:
      - name: Validate Secrets
        shell: pwsh
        run: |
          if (-not "${{ secrets.PRIVATE_REPO_TOKEN }}") {
            Write-Error "CRITICAL: 'PRIVATE_REPO_TOKEN' secret is missing! Please configure it in repo secrets."
            exit 1
          }
          Write-Host "Secrets validation passed."

      - name: Setup Build Parameters
        shell: pwsh
        run: |
          $rawDebug = "${{ inputs.build_debug }}"
          if (-not $rawDebug) { $rawDebug = "${{ github.event.client_payload.build_debug }}" }
          $doDebug = if ($rawDebug -eq "false") { "false" } else { "true" }

          $rawRelease = "${{ inputs.build_release }}"
          if (-not $rawRelease) { $rawRelease = "${{ github.event.client_payload.build_release }}" }
          $doRelease = if ($rawRelease -eq "false") { "false" } else { "true" }

          $rawInstaller = "${{ inputs.build_installer }}"
          if (-not $rawInstaller) { $rawInstaller = "${{ github.event.client_payload.build_installer }}" }
          $doInstaller = if ($rawInstaller -eq "false") { "false" } else { "true" }

          $rawRelUpload = "${{ inputs.upload_releases }}"
          if (-not $rawRelUpload) { $rawRelUpload = "${{ github.event.client_payload.upload_releases }}" }
          $doRelUpload = if ($rawRelUpload -eq "false") { "false" } else { "true" }

          $rawGDrive = "${{ inputs.upload_gdrive }}"
          if (-not $rawGDrive) { $rawGDrive = "${{ github.event.client_payload.upload_gdrive }}" }
          $doGDrive = if ($rawGDrive -eq "false") { "false" } else { "true" }

          "DO_BUILD_DEBUG=$doDebug" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DO_BUILD_RELEASE=$doRelease" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DO_BUILD_INSTALLER=$doInstaller" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DO_UPLOAD_RELEASES=$doRelUpload" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DO_UPLOAD_GDRIVE=$doGDrive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Build Configuration:"
          Write-Host "  TARGET_BRANCH: $env:TARGET_BRANCH"
          Write-Host "  DO_BUILD_DEBUG: $doDebug"
          Write-Host "  DO_BUILD_RELEASE: $doRelease"
          Write-Host "  DO_BUILD_INSTALLER: $doInstaller"
          Write-Host "  DO_UPLOAD_RELEASES: $doRelUpload"
          Write-Host "  DO_UPLOAD_GDRIVE: $doGDrive"

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: XAI-Medica/Remet
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}
          lfs: false

      - name: Download Alpha SDK
        shell: pwsh
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          $headers = @{ 
            Authorization = "Bearer $env:PRIVATE_TOKEN"
            Accept = "application/octet-stream"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:PRIVATE_REPO/releases/tags/alpha-sdk-v1" -Headers @{ Authorization = "Bearer $env:PRIVATE_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -eq "Alpha_Sdk.zip" }
          if (-not $asset) {
            Write-Error "Alpha_Sdk.zip not found in release alpha-sdk-v1!"
            exit 1
          }
          Invoke-WebRequest -Uri $asset.url -OutFile "Alpha_Sdk.zip" -Headers $headers
          Expand-Archive -Path Alpha_Sdk.zip -DestinationPath . -Force
          Remove-Item Alpha_Sdk.zip -Force

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore Remet19.sln

      # -----------------------------------------------------------------------
      # Debug Build (debug_remet Win32 & debug_remet x64 only)
      # -----------------------------------------------------------------------
      - name: Build Debug (Win32 & x64)
        if: env.DO_BUILD_DEBUG == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force OutPut -ErrorAction SilentlyContinue
          Write-Host "Building Debug_Remet Win32..."
          MSBuild.exe /m:1 Remet19.sln "/t:Clean;Build" /p:Configuration=Debug_Remet /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Building Debug_Remet x64..."
          MSBuild.exe /m:1 Remet19.sln "/t:Clean;Build" /p:Configuration=Debug_Remet /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Debug Build
        if: env.DO_BUILD_DEBUG == 'true' && (env.DO_UPLOAD_RELEASES == 'true' || env.DO_UPLOAD_GDRIVE == 'true')
        shell: pwsh
        run: |
          $versionFile = "Remet Install\Version_Include_var.wxi"
          if ((Test-Path $versionFile) -and ((Get-Content $versionFile -Raw) -match '<\?define\s+version=["'']?([^"''\s]+)["'']?\s*\?>')) {
            $version = $matches[1]
            $tagName = "v$version"
          } else {
            $version = (Get-Date -Format "yyyyMMdd-HHmmss")
            $tagName = "v$version"
          }

          $remetShaFull = (git rev-parse HEAD).Trim()
          $remetShaShort = (git rev-parse --short HEAD).Trim()
          $safeBranch = $env:TARGET_BRANCH -replace '[^a-zA-Z0-9._-]', '-'

          $qaPassword = ""
          if (Test-Path "QA_TEST_INSTRUCTIONS.md") {
            $rawQa = Get-Content -Path "QA_TEST_INSTRUCTIONS.md" -Raw -Encoding utf8
            if ($rawQa -match '(?m)QA_ARCHIVE_PASSWORD\)\s*:\s*\*{0,2}\s*`?([A-Za-z0-9!@#$%^&*_+=\-]{8,64})`?') {
              $qaPassword = $matches[1].Trim()
            }
          }
          if (-not $qaPassword) {
            $commitMsg = (git log -1 --pretty=%B) -join "`n"
            if ($commitMsg -match '\[QA-Pass:\s*([A-Za-z0-9!@#$%^&*_+=\-]{8,64})\]') {
              $qaPassword = $matches[1].Trim()
            }
          }
          if (-not $qaPassword) {
            $alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"
            $chars = for ($i = 0; $i -lt 24; $i++) { $alphabet[[System.Security.Cryptography.RandomNumberGenerator]::GetInt32(0, $alphabet.Length)] }
            $qaPassword = -join $chars
          }
          Write-Host "::add-mask::$qaPassword"

          $debugPkgDir = "$env:RUNNER_TEMP\debug_package"
          New-Item -ItemType Directory -Path $debugPkgDir -Force | Out-Null
          if ($env:TARGET_BRANCH -eq "master") {
            $archiveName = "Remet-Debug-x86-x64-$tagName.7z"
          } else {
            $archiveName = "Remet-Debug-x86-x64-$tagName-$safeBranch-$remetShaShort.7z"
          }
          $archivePath = "$debugPkgDir\$archiveName"

          $buildDate = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $manifest = "Debug Build Information`r`n=======================`r`nVersion: $version`r`nBuild Date: $buildDate`r`nBranch: $env:TARGET_BRANCH`r`nCommit: $remetShaFull`r`nArchive: $archiveName (7z AES-256 -mhe=on)`r`nConfigurations: Debug_Remet (Win32, x64)`r`n"
          $manifestPath = "$debugPkgDir\build-info.txt"
          [System.IO.File]::WriteAllText($manifestPath, $manifest, $utf8NoBom)
          Copy-Item -Path $manifestPath -Destination "OutPut\build-info.txt" -Force

          if (Test-Path "QA_TEST_INSTRUCTIONS.md") {
            $authorQa = Get-Content -Path "QA_TEST_INSTRUCTIONS.md" -Raw -Encoding utf8
            $qaOut = "$debugPkgDir\QA_TEST_INSTRUCTIONS.md"
            if ($authorQa -notmatch '(?m)QA_ARCHIVE_PASSWORD\)\s*:\s*\*{0,2}\s*`?[A-Za-z0-9!@#$%^&*_+=\-]{8,64}`?') {
              $authorQa = "<!-- auto-generated-build-metadata -->`n- **Архів (.7z AES-256):** ``$archiveName```n- **Пароль архіву (QA_ARCHIVE_PASSWORD):** ``$qaPassword```n`n---`n`n$authorQa"
            }
            [System.IO.File]::WriteAllText($qaOut, $authorQa, $utf8NoBom)
            Copy-Item -Path $qaOut -Destination "OutPut\QA_TEST_INSTRUCTIONS.md" -Force
            "QA_INSTRUCTIONS_PATH=$qaOut" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }

          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip -and (Test-Path "$env:ProgramFiles\7-Zip\7z.exe")) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (-not $sevenZip) {
            Write-Error "7-Zip (7z.exe) is required for AES-256 encryption but was not found."
            exit 1
          }

          Write-Host "Compressing & encrypting debug build (AES-256 + -mhe=on) to $archivePath..."
          Push-Location OutPut
          try {
            & $sevenZip a -t7z -m0=lzma2 -mx=5 -mhe=on "-p$qaPassword" "$archivePath" *
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

          "DEBUG_ARCHIVE_PATH=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DEBUG_ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QA_ARCHIVE_PASSWORD=$qaPassword" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "REMET_SHA_FULL=$remetShaFull" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "REMET_SHA_SHORT=$remetShaShort" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Encrypted debug package prepared: $archiveName"

          # Clean OutPut directory so Release and Installer build start fresh
          Remove-Item -Recurse -Force OutPut -ErrorAction SilentlyContinue

      - name: Record QA Password in Private Commit
        if: env.DO_BUILD_DEBUG == 'true' && env.QA_ARCHIVE_PASSWORD != '' && env.REMET_SHA_FULL != '' && env.DO_UPLOAD_GDRIVE == 'true'
        shell: pwsh
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          Write-Host "::add-mask::$env:QA_ARCHIVE_PASSWORD"
          $headers = @{
            Authorization = "Bearer $env:PRIVATE_TOKEN"
            Accept = "application/vnd.github.v3+json"
          }
          $noteLines = @(
            "### Зашифрована QA / Debug-збірка (AES-256, тільки Google Drive)"
            "- **Гілка:** ``$env:TARGET_BRANCH``"
            "- **Версія ПЗ:** ``$env:APP_VERSION``"
            "- **Архів (.7z):** ``$env:DEBUG_ARCHIVE_NAME``"
            "- **Пароль розпакування (7-Zip AES-256):** ``$env:QA_ARCHIVE_PASSWORD``"
            "- **Google Drive:** ``Remet/Business XAI-MEDICA/Distributive/$env:RELEASE_TAG``"
            "- **CI Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          $body = @{ body = ($noteLines -join "`n") } | ConvertTo-Json -Depth 3
          try {
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:PRIVATE_REPO/commits/$env:REMET_SHA_FULL/comments" -Headers $headers -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) -ContentType "application/json; charset=utf-8" | Out-Null
            Write-Host "Recorded encrypted QA archive password on private commit $env:REMET_SHA_SHORT"
          } catch {
            Write-Warning "Could not post QA password comment to private commit $($env:REMET_SHA_SHORT): $_"
          }

      # -----------------------------------------------------------------------
      # Release Build
      # -----------------------------------------------------------------------
      - name: Build Release (Win32)
        if: env.DO_BUILD_RELEASE == 'true'
        run: |
          MSBuild.exe /m:1 Remet19.sln "/t:Clean;Build" /p:Configuration=Release_Remet /p:Platform=Win32 /v:minimal
          MSBuild.exe /m:1 Remet19.sln /t:Build /p:Configuration=Release_OnlyNeurocom /p:Platform=Win32 /v:minimal
          MSBuild.exe /m:1 Remet19.sln /t:Build /p:Configuration=Release_OnlyReocom /p:Platform=Win32 /v:minimal
          MSBuild.exe /m:1 Remet19.sln /t:Build /p:Configuration=Release_OnlySpirocom /p:Platform=Win32 /v:minimal
          MSBuild.exe /m:1 Remet19.sln /t:Build /p:Configuration=Release_OnlyStress /p:Platform=Win32 /v:minimal

      - name: Build Release (x64)
        if: env.DO_BUILD_RELEASE == 'true'
        run: |
          MSBuild.exe /m:1 Remet19.sln "/t:Clean;Build" /p:Configuration=Release_Remet /p:Platform=x64 /v:minimal
          MSBuild.exe /m:1 Remet19.sln /t:Build /p:Configuration=Release_OnlyNeurocom /p:Platform=x64 /v:minimal
          MSBuild.exe /m:1 Remet19.sln /t:Build /p:Configuration=Release_OnlyReocom /p:Platform=x64 /v:minimal
          MSBuild.exe /m:1 Remet19.sln /t:Build /p:Configuration=Release_OnlySpirocom /p:Platform=x64 /v:minimal
          MSBuild.exe /m:1 Remet19.sln /t:Build /p:Configuration=Release_OnlyStress /p:Platform=x64 /v:minimal

      # -----------------------------------------------------------------------
      # Installer Build
      # -----------------------------------------------------------------------
      - name: Build Installer (Win32 & x64)
        if: env.DO_BUILD_INSTALLER == 'true'
        run: |
          MSBuild.exe /m:1 Install.sln /t:Rebuild /p:Configuration=Installer_Release /p:Platform=Win32
          MSBuild.exe /m:1 Install.sln /t:Rebuild /p:Configuration=Installer_Release /p:Platform=x64

      # -----------------------------------------------------------------------
      # Upload Installer to External Release (remet.releases)
      # -----------------------------------------------------------------------
      - name: Upload Installer to External Release
        if: env.DO_BUILD_INSTALLER == 'true' && env.DO_UPLOAD_RELEASES == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Warning "RELEASES_REPO_TOKEN secret missing - skipping installer release upload"
            return
          }
          $versionFile = "Remet Install\Version_Include_var.wxi"
          if (-not (Test-Path $versionFile)) {
            Write-Error "Version file not found: $versionFile"
            exit 1
          }
          $versionContent = Get-Content $versionFile -Raw
          if ($versionContent -match '<\?define\s+version=["'']?([^"''\s]+)["'']?\s*\?>') {
            $version = $matches[1]
            $tagName = "v$version"
            Write-Host "Detected version: $version (Tag: $tagName)"
          } else {
            Write-Error "Could not extract version from $versionFile"
            exit 1
          }

          gh release create $tagName --repo $env:RELEASES_REPO --title "$tagName" --notes "Automated release for version $version" --prerelease --latest=false || Write-Host "Release already exists"
          $files = Get-ChildItem "OutPut/remet/Inst/release" -Recurse -File | Select-Object -ExpandProperty FullName
          gh release upload $tagName $files --repo $env:RELEASES_REPO --clobber
          Write-Host "Successfully uploaded installer to $env:RELEASES_REPO"

      # -----------------------------------------------------------------------
      # Upload to Google Drive (Installer and/or Debug) via rclone
      # -----------------------------------------------------------------------
      - name: Upload to Google Drive
        if: env.DO_UPLOAD_GDRIVE == 'true' && (env.DO_BUILD_INSTALLER == 'true' || env.DO_BUILD_DEBUG == 'true')
        shell: pwsh
        run: |
          if (-not "${{ secrets.RCLONE_REMOTE_CONFIG_B64 }}") {
            Write-Warning "RCLONE_REMOTE_CONFIG_B64 is not set - skipping GDrive upload"
            return
          }

          # Download and install rclone on Windows runner
          Write-Host "Setting up rclone..."
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path rclone.zip -DestinationPath . -Force
          $rcloneExe = (Get-ChildItem -Path . -Filter "rclone.exe" -Recurse | Select-Object -First 1).FullName

          $rcloneConfigDir = "$env:USERPROFILE\.config\rclone"
          New-Item -ItemType Directory -Path $rcloneConfigDir -Force | Out-Null
          $bytes = [Convert]::FromBase64String("${{ secrets.RCLONE_REMOTE_CONFIG_B64 }}")
          [IO.File]::WriteAllBytes("$rcloneConfigDir\rclone.conf", $bytes)

          # Extract version
          $versionFile = "Remet Install\Version_Include_var.wxi"
          $versionContent = if (Test-Path $versionFile) { Get-Content $versionFile -Raw } else { "" }
          if ($versionContent -match '<\?define\s+version=["'']?([^"''\s]+)["'']?\s*\?>') {
            $tagName = "v$($matches[1])"
          } else {
            $tagName = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "latest" }
          }

          $destPath = "gdrive:Remet/Business XAI-MEDICA/Distributive/$tagName"
          Write-Host "Target Google Drive directory: $destPath"

          # 1. Upload Installer if built
          if (("$env:DO_BUILD_INSTALLER" -eq 'true') -and (Test-Path "OutPut/remet/Inst/release")) {
            Write-Host "Uploading Installer to $destPath via rclone..."
            & $rcloneExe copy "OutPut/remet/Inst/release" "$destPath" --progress --checksum
          }

          # 2. Upload encrypted Debug package (and QA instructions if present)
          if (("$env:DO_BUILD_DEBUG" -eq 'true') -and $env:DEBUG_ARCHIVE_PATH -and (Test-Path $env:DEBUG_ARCHIVE_PATH)) {
            Write-Host "Uploading encrypted Debug package ($env:DEBUG_ARCHIVE_NAME) to $destPath via rclone..."
            & $rcloneExe copy "$env:DEBUG_ARCHIVE_PATH" "$destPath" --progress --checksum
            if ($env:QA_INSTRUCTIONS_PATH -and (Test-Path $env:QA_INSTRUCTIONS_PATH)) {
              & $rcloneExe copy "$env:QA_INSTRUCTIONS_PATH" "$destPath" --progress --checksum
            }
          }

          # Cleanup rclone config
          Remove-Item "$rcloneConfigDir\rclone.conf" -Force -ErrorAction SilentlyContinue
          Write-Host "Google Drive upload completed successfully!"

      # -----------------------------------------------------------------------
      # Optional Encrypted Artifacts (Zero leakage if downloaded by third party)
      # -----------------------------------------------------------------------
      - name: Encrypt and Upload Artifacts (Optional)
        if: always()
        shell: pwsh
        env:
          KEY: ${{ secrets.ARTIFACTS_ENCRYPTION_KEY }}
        run: |
          if (-not $env:KEY) {
            Write-Host "ARTIFACTS_ENCRYPTION_KEY not set. Skipping public artifact upload to keep proprietary code/binaries 100% secret."
            return
          }
          if (-not (Test-Path "OutPut")) {
            Write-Host "OutPut directory does not exist. Skipping encrypted artifacts upload."
            return
          }
          Write-Host "Encrypting build outputs with AES-256..."
          7z a -p"$env:KEY" -mhe=on "encrypted-build-$env:TARGET_BRANCH.7z" OutPut/
          echo "UPLOAD_ENCRYPTED=true" >> $env:GITHUB_ENV

      - name: Upload Encrypted Artifact
        if: env.UPLOAD_ENCRYPTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-build
          path: encrypted-build-*.7z
          retention-days: 7

      - name: Clean Runner Workspace
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force OutPut, tmpProj, * -ErrorAction SilentlyContinue || $true
