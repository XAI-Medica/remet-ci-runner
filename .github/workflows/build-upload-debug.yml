name: Debug Build+Upload (Public Runner)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch in private repo'
        required: true
        default: 'master'
      upload_gdrive:
        description: 'Upload Debug package to Google Drive'
        type: boolean
        default: true
      qa_notes:
        description: 'Optional notes for QA tester (included in QA_TEST_INSTRUCTIONS.md)'
        required: false
        default: ''
      base_ref:
        description: 'Base branch, tag, or commit SHA for QA changelog diff'
        required: false
        default: 'master'
  repository_dispatch:
    types: [build-upload-debug]

jobs:
  build-and-upload-debug:
    runs-on: windows-2022
    env:
      TARGET_BRANCH: ${{ inputs.branch || github.event.client_payload.branch || 'master' }}
      QA_NOTES: ${{ inputs.qa_notes || github.event.client_payload.qa_notes || '' }}
      BASE_REF: ${{ inputs.base_ref || github.event.client_payload.base_ref || 'master' }}
      PRIVATE_REPO: "XAI-Medica/Remet"
      OutPut: ${{ github.workspace }}\OutPut
      tmpProj: ${{ github.workspace }}\tmpProj
    steps:
      - name: Validate Secrets
        shell: pwsh
        run: |
          if (-not "${{ secrets.PRIVATE_REPO_TOKEN }}") {
            Write-Error "CRITICAL: 'PRIVATE_REPO_TOKEN' secret is missing!"
            exit 1
          }

      - name: Setup Parameters
        shell: pwsh
        run: |
          $rawGDrive = "${{ inputs.upload_gdrive }}"
          if (-not $rawGDrive) { $rawGDrive = "${{ github.event.client_payload.upload_gdrive }}" }
          $doGDrive = if ($rawGDrive -eq "false") { "false" } else { "true" }

          "DO_UPLOAD_GDRIVE=$doGDrive" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Parameters:"
          Write-Host "  TARGET_BRANCH: $env:TARGET_BRANCH"
          Write-Host "  DO_UPLOAD_GDRIVE: $doGDrive"

      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          repository: XAI-Medica/Remet
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 200
          lfs: false

      - name: Fetch Base Branch for Diff
        shell: pwsh
        run: |
          git fetch --no-tags --depth=50 origin master:refs/remotes/origin/master
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Could not fetch origin/master for branch diff."
          }

      - name: Download Alpha SDK
        shell: pwsh
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          $headers = @{ 
            Authorization = "Bearer $env:PRIVATE_TOKEN"
            Accept = "application/octet-stream"
          }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:PRIVATE_REPO/releases/tags/alpha-sdk-v1" -Headers @{ Authorization = "Bearer $env:PRIVATE_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -eq "Alpha_Sdk.zip" }
          if (-not $asset) {
            Write-Error "Alpha_Sdk.zip not found in release alpha-sdk-v1!"
            exit 1
          }
          Invoke-WebRequest -Uri $asset.url -OutFile "Alpha_Sdk.zip" -Headers $headers
          Expand-Archive -Path Alpha_Sdk.zip -DestinationPath . -Force
          Remove-Item Alpha_Sdk.zip -Force

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: nuget restore Remet19.sln

      # -----------------------------------------------------------------------
      # Debug Build (debug_remet Win32 & debug_remet x64 only)
      # -----------------------------------------------------------------------
      - name: Build Debug (Win32 & x64)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force OutPut -ErrorAction SilentlyContinue
          Write-Host "Building Debug_Remet Win32..."
          MSBuild.exe /m:1 Remet19.sln "/t:Clean;Build" /p:Configuration=Debug_Remet /p:Platform=Win32 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Building Debug_Remet x64..."
          MSBuild.exe /m:1 Remet19.sln "/t:Clean;Build" /p:Configuration=Debug_Remet /p:Platform=x64 /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # -----------------------------------------------------------------------
      # Prepare QA Instructions & Package Encrypted Debug Build (.7z AES-256)
      # -----------------------------------------------------------------------
      - name: Prepare QA Instructions & Package Encrypted Debug Build
        shell: pwsh
        run: |
          $versionFile = "Remet Install\Version_Include_var.wxi"
          if ((Test-Path $versionFile) -and ((Get-Content $versionFile -Raw) -match '<\?define\s+version=["'']?([^"''\s]+)["'']?\s*\?>')) {
            $version = $matches[1]
            $tagName = "v$version"
          } else {
            $version = (Get-Date -Format "yyyyMMdd-HHmmss")
            $tagName = "v$version"
          }

          $remetShaFull = (git rev-parse HEAD).Trim()
          $remetShaShort = (git rev-parse --short HEAD).Trim()
          $buildDate = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
          $safeBranch = $env:TARGET_BRANCH -replace '[^a-zA-Z0-9._-]', '-'

          $qaPassword = ""
          if (Test-Path "QA_TEST_INSTRUCTIONS.md") {
            $rawQa = Get-Content -Path "QA_TEST_INSTRUCTIONS.md" -Raw -Encoding utf8
            if ($rawQa -match '(?m)QA_ARCHIVE_PASSWORD\)\s*:\s*\*{0,2}\s*`?([A-Za-z0-9!@#$%^&*_+=\-]{8,64})`?') {
              $qaPassword = $matches[1].Trim()
            }
          }
          if (-not $qaPassword) {
            $commitMsg = (git log -1 --pretty=%B) -join "`n"
            if ($commitMsg -match '\[QA-Pass:\s*([A-Za-z0-9!@#$%^&*_+=\-]{8,64})\]') {
              $qaPassword = $matches[1].Trim()
            }
          }
          if (-not $qaPassword) {
            $alphabet = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789"
            $chars = for ($i = 0; $i -lt 24; $i++) { $alphabet[[System.Security.Cryptography.RandomNumberGenerator]::GetInt32(0, $alphabet.Length)] }
            $qaPassword = -join $chars
          }
          Write-Host "::add-mask::$qaPassword"

          $rawBase = if ($env:BASE_REF) { $env:BASE_REF.Trim() } else { "master" }
          $resolvedBase = ""
          if ($rawBase -eq "master") {
            if ($env:TARGET_BRANCH -ne "master") {
              $resolvedBase = "origin/master"
            }
          } else {
            git fetch --tags --depth=100 origin 2>$null | Out-Null
            if (git rev-parse --verify "$rawBase^{commit}" 2>$null) {
              $resolvedBase = $rawBase
            } elseif (git rev-parse --verify "origin/$rawBase^{commit}" 2>$null) {
              $resolvedBase = "origin/$rawBase"
            } else {
              git fetch --no-tags --depth=100 origin "$rawBase" 2>$null | Out-Null
              if (git rev-parse --verify "$rawBase^{commit}" 2>$null) {
                $resolvedBase = $rawBase
              } else {
                Write-Warning "Could not resolve base_ref '$rawBase'; falling back to default diff."
              }
            }
          }

          $commitLog = ""
          $diffFiles = ""
          if ($resolvedBase) {
            $commitLog = (git log "$resolvedBase..HEAD" --oneline -n 100) -join "`n"
            $diffFiles = (git diff --name-status "$resolvedBase..HEAD") -join "`n"
          }
          if (-not $commitLog) {
            $commitLog = (git log -n 10 --oneline) -join "`n"
          }
          if (-not $diffFiles) {
            $diffFiles = (git diff --name-status HEAD~1 HEAD 2>$null) -join "`n"
          }

          $debugPkgDir = "$env:RUNNER_TEMP\debug_package"
          New-Item -ItemType Directory -Path $debugPkgDir -Force | Out-Null

          if ($env:TARGET_BRANCH -eq "master") {
            $archiveName = "Remet-Debug-x86-x64-$tagName.7z"
          } else {
            $archiveName = "Remet-Debug-x86-x64-$tagName-$safeBranch-$remetShaShort.7z"
          }
          $archivePath = "$debugPkgDir\$archiveName"

          $qaPath = "$debugPkgDir\QA_TEST_INSTRUCTIONS.md"
          $diffLabel = if ($resolvedBase) { "$resolvedBase..HEAD" } else { "recent commits" }
          $metaLines = @(
            "<!-- auto-generated-build-metadata -->"
            "## Паспорт тестової збірки (автоматично згенеровано CI)"
            "- **Репозиторій / Гілка:** ``$env:PRIVATE_REPO`` @ ``$env:TARGET_BRANCH``"
            "- **Версія ПЗ:** ``$version``"
            "- **Коміт Remet:** ``$remetShaFull`` (``$remetShaShort``)"
            "- **Діапазон змін:** ``$diffLabel``"
            "- **Дата збірки (UTC/Runner):** $buildDate"
            "- **Зашифрований архів (.7z AES-256):** ``$archiveName``"
            "- **Пароль архіву (QA_ARCHIVE_PASSWORD):** ``$qaPassword``"
          )
          if ($env:QA_NOTES) {
            $metaLines += "- **Нотатки розробника:** $env:QA_NOTES"
          }
          $metaHeader = ($metaLines -join "`n")
          $metaHeader += "`n`n### Коміти у збірці`n``````text`n$commitLog`n```````n"
          if ($diffFiles) {
            $metaHeader += "`n### Змінені файли`n``````text`n$diffFiles`n```````n"
          }

          if (Test-Path "QA_TEST_INSTRUCTIONS.md") {
            Write-Host "Found branch-specific QA_TEST_INSTRUCTIONS.md; prepending CI build passport..."
            $authorQa = Get-Content -Path "QA_TEST_INSTRUCTIONS.md" -Raw -Encoding utf8
            $qaContent = "$metaHeader`n---`n`n$authorQa"
          } else {
            Write-Host "No QA_TEST_INSTRUCTIONS.md in branch; generating default Human + AI Tester guide from git diff..."
            $qaContent = @(
              "# Інструкція з тестування збірки REMET"
              ""
              $metaHeader
              "---"
              ""
              "## Частина 1. Інструкція для людини-тестувальника"
              "1. Завантажте та розпакуйте зашифрований ``$archiveName`` (пароль вказано вище або у коментарі до коміту ``$remetShaShort`` у приватному ``XAI-Medica/Remet``) у окрему папку (не поверх робочого каталогу клініки)."
              "2. Перевірте запуск збірок у підкаталогах ``Win32\Debug\`` та ``x64\Debug\``."
              "3. Протестуйте функціональність, зазначену у розділах **«Нотатки розробника»** та **«Коміти у збірці»** вище, а також суміжні сценарії."
              ""
              "## Частина 2. Промпт для ШІ-агента тестувальника"
              "Скопіюйте цей промпт вашому ШІ-агенту разом із розпакованим архівом і цим файлом:"
              ""
              "> *`"Прочитай файл ``QA_TEST_INSTRUCTIONS.md``. Перевір версії виконуваних файлів у розпакованому каталозі збірки (``Win32\Debug`` та ``x64\Debug``), поясни мені людською мовою, що змінилося за списком комітів і файлів вище, допоможи крок за кроком протестувати ці зміни на приладі або симуляторі й сформуй структурований ``QA_REPORT.md`` для розробника.`"*"
            ) -join "`n"
          }

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($qaPath, $qaContent, $utf8NoBom)
          Copy-Item -Path $qaPath -Destination "OutPut\QA_TEST_INSTRUCTIONS.md" -Force

          $manifest = "Debug Build Information`r`n=======================`r`nVersion: $version`r`nBuild Date: $buildDate`r`nBranch: $env:TARGET_BRANCH`r`nCommit: $remetShaFull`r`nArchive: $archiveName (7z AES-256 -mhe=on)`r`nConfigurations: Debug_Remet (Win32, x64)`r`n"
          $manifestPath = "$debugPkgDir\build-info.txt"
          [System.IO.File]::WriteAllText($manifestPath, $manifest, $utf8NoBom)
          Copy-Item -Path $manifestPath -Destination "OutPut\build-info.txt" -Force

          $sevenZip = (Get-Command 7z -ErrorAction SilentlyContinue).Source
          if (-not $sevenZip -and (Test-Path "$env:ProgramFiles\7-Zip\7z.exe")) { $sevenZip = "$env:ProgramFiles\7-Zip\7z.exe" }
          if (-not $sevenZip) {
            Write-Error "7-Zip (7z.exe) is required for AES-256 encryption but was not found."
            exit 1
          }

          Write-Host "Compressing & encrypting debug build (AES-256 + -mhe=on) to $archivePath..."
          Push-Location OutPut
          try {
            & $sevenZip a -t7z -m0=lzma2 -mx=5 -mhe=on "-p$qaPassword" "$archivePath" *
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }

          "DEBUG_ARCHIVE_PATH=$archivePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DEBUG_ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QA_INSTRUCTIONS_PATH=$qaPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "QA_ARCHIVE_PASSWORD=$qaPassword" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "REMET_SHA_FULL=$remetShaFull" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "REMET_SHA_SHORT=$remetShaShort" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SAFE_BRANCH=$safeBranch" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Encrypted debug package prepared: $archiveName"

      # -----------------------------------------------------------------------
      # Upload Debug (.7z + QA_TEST_INSTRUCTIONS.md) to Private Google Drive
      # -----------------------------------------------------------------------
      - name: Upload Debug to Google Drive
        if: env.DO_UPLOAD_GDRIVE == 'true'
        shell: pwsh
        run: |
          if (-not "${{ secrets.RCLONE_REMOTE_CONFIG_B64 }}") {
            Write-Warning "RCLONE_REMOTE_CONFIG_B64 is not set - skipping GDrive upload"
            return
          }

          Write-Host "Setting up rclone..."
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile "rclone.zip"
          Expand-Archive -Path rclone.zip -DestinationPath . -Force
          $rcloneExe = (Get-ChildItem -Path . -Filter "rclone.exe" -Recurse | Select-Object -First 1).FullName

          $rcloneConfigDir = "$env:USERPROFILE\.config\rclone"
          New-Item -ItemType Directory -Path $rcloneConfigDir -Force | Out-Null
          $bytes = [Convert]::FromBase64String("${{ secrets.RCLONE_REMOTE_CONFIG_B64 }}")
          [IO.File]::WriteAllBytes("$rcloneConfigDir\rclone.conf", $bytes)

          $tagName = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "latest" }
          if ($env:TARGET_BRANCH -eq "master") {
            $destPath = "gdrive:Remet/Business XAI-MEDICA/Distributive/$tagName"
          } else {
            $destPath = "gdrive:Remet/Business XAI-MEDICA/Distributive/$tagName/QA-$env:SAFE_BRANCH"
          }

          Write-Host "Target Google Drive directory: $destPath"
          Write-Host "Uploading encrypted Debug package ($env:DEBUG_ARCHIVE_NAME) and QA_TEST_INSTRUCTIONS.md to $destPath via rclone..."
          & $rcloneExe copy "$env:DEBUG_ARCHIVE_PATH" "$destPath" --progress --checksum
          & $rcloneExe copy "$env:QA_INSTRUCTIONS_PATH" "$destPath" --progress --checksum

          # Cleanup rclone config
          Remove-Item "$rcloneConfigDir\rclone.conf" -Force -ErrorAction SilentlyContinue
          Write-Host "Google Drive upload completed successfully!"

      # -----------------------------------------------------------------------
      # Record Decryption Password in Private Remet Commit Comment
      # -----------------------------------------------------------------------
      - name: Record QA Password in Private Commit
        if: env.QA_ARCHIVE_PASSWORD != '' && env.REMET_SHA_FULL != '' && env.DO_UPLOAD_GDRIVE == 'true'
        shell: pwsh
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          Write-Host "::add-mask::$env:QA_ARCHIVE_PASSWORD"
          $headers = @{
            Authorization = "Bearer $env:PRIVATE_TOKEN"
            Accept = "application/vnd.github.v3+json"
          }
          $gdriveSubdir = if ($env:TARGET_BRANCH -eq "master") {
            "Remet/Business XAI-MEDICA/Distributive/$env:RELEASE_TAG"
          } else {
            "Remet/Business XAI-MEDICA/Distributive/$env:RELEASE_TAG/QA-$env:SAFE_BRANCH"
          }
          $noteLines = @(
            "### Зашифрована QA / Debug-збірка (AES-256, тільки Google Drive)"
            "- **Гілка:** ``$env:TARGET_BRANCH``"
            "- **Версія ПЗ:** ``$env:APP_VERSION``"
            "- **Архів (.7z):** ``$env:DEBUG_ARCHIVE_NAME``"
            "- **Пароль розпакування (7-Zip AES-256):** ``$env:QA_ARCHIVE_PASSWORD``"
            "- **Google Drive (папка збірки, інструкцій та звітів QA):** ``$gdriveSubdir``"
            "- **CI Run:** https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          )
          $body = @{ body = ($noteLines -join "`n") } | ConvertTo-Json -Depth 3
          try {
            Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:PRIVATE_REPO/commits/$env:REMET_SHA_FULL/comments" -Headers $headers -Body ([System.Text.Encoding]::UTF8.GetBytes($body)) -ContentType "application/json; charset=utf-8" | Out-Null
            Write-Host "Recorded encrypted QA archive password on private commit $env:REMET_SHA_SHORT"
          } catch {
            Write-Warning "Could not post QA password comment to private commit $($env:REMET_SHA_SHORT): $_"
          }

      - name: Clean Workspace
        if: always()
        shell: pwsh
        run: Remove-Item -Recurse -Force OutPut, tmpProj, * -ErrorAction SilentlyContinue || $true
